# Publishes to npm when a GitHub release is created.
#
# Authentication is npm trusted publishing over OIDC: GitHub vouches for the
# workflow identity and npm checks it, so there is no long lived token in
# repository secrets to leak or rotate. Provenance attestations are generated
# automatically, no flag needed.
#
# This only works once npmjs.com has a trusted publisher configured for the
# package, matching this workflow's filename, the repository owner
# (case sensitive) and the repository name. Changing the filename breaks it.
#
# For more information see:
#   https://docs.npmjs.com/trusted-publishers/

name: Node.js Package

on:
  release:
    # `published`, not `created`: saving a release as a DRAFT fires `created`,
    # so a half written draft would publish to npm.  `published` fires when a
    # draft is published, or a release is created already published.
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --silent --verbose
      - run: npm run lint

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the runner mint the OIDC token npm checks
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # no dependency cache in a release build: publish what the
          # lockfile says, not what a cache happened to hold
      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a recent npm,
      # but pinning the upgrade here means a runner image change cannot
      # quietly drop below the floor - the symptom is an opaque ENEEDAUTH.
      - run: npm install -g npm@latest
      - run: npm ci
      # `prepack` builds, so dist is always made from this checkout rather
      # than whatever happened to be on disk
      - run: npm publish
